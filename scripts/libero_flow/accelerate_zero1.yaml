compute_environment: LOCAL_MACHINE
debug: false
distributed_type: DEEPSPEED
deepspeed_config:
  deepspeed_config_file: configs/libero/deepspeed_zero1.json
  # Inspire starts this launcher on every node; join through torchrun.
  # The default pdsh launcher requires a hostfile and otherwise uses only local GPUs.
  deepspeed_multinode_launcher: standard
  zero3_init_flag: false
mixed_precision: null
machine_rank: 0
main_training_function: main
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
use_cpu: false
