# Controlled fresh Action initialization; not continuation from Action-30k.
_base_: train_action.yaml
benchmark: libero
output_dir: runs/libero/meanflow_fresh
batch_size: 16
gradient_accumulation_steps: 1
meanflow:
  objective: data_meanflow
  time_convention: clean0_noise1
  preserve_baseline_trainability: true
  student_init:
    format: baseline_init
    action_checkpoint: weights/libero/action_init.pt
    video_checkpoint: weights/libero/video_step010000.pt
  interval:
    source: shifted_uniform
    diagonal_time_sampling: sorted_max
    diagonal_probability: 0.5
  loss_weighting: adaptive
  adaptive_weighting:
    power: 0.5
    c: 0.001
  derivative_backend: jvp
  auxiliary_geometry: false
inference:
  action_sampler: meanflow
  action_nfe: 1
