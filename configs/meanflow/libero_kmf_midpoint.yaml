_base_: ../libero/train_action.yaml
benchmark: libero
output_dir: runs/libero/kmf_midpoint
reference_global_batch_size: 256
batch_size: 1
gradient_accumulation_steps: 256
meanflow:
  objective: kmf
  split: midpoint
  time_convention: clean0_noise1
  preserve_baseline_trainability: true
  student_init:
    format: deployment_pair
    action_checkpoint: weights/libero_release/checkpoints/libero/action_step030000.pt
    video_checkpoint: weights/libero_release/checkpoints/libero/video_step010000.pt
  teacher:
    format: deployment_pair
    action_checkpoint: ${meanflow.student_init.action_checkpoint}
    video_checkpoint: ${meanflow.student_init.video_checkpoint}
    steps: 10
    sigma_shift: 5.0
    frozen: true
    proprio_source: teacher_checkpoint
  interval:
    source: shifted_uniform
    full_interval_probability: 0.0
    diagonal_probability: 0.5
    min_gap: 0.0001
  loss_weighting: uniform
  derivative_backend: jvp
  finite_difference_step: 0.01
  generator_alpha: 0.1
  auxiliary_geometry: false
inference:
  action_sampler: meanflow
  action_nfe: 1

model:
  model_id: weights/libero_release/checkpoints/Wan2.1-I2V-14B-480P
  tokenizer_model_id: ${model.model_id}/google/umt5-xxl
